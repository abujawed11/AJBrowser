<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AJBrowser spike: popup opener</title>
    <style>body { font-family: "Segoe UI", sans-serif; margin: 24px; }</style>
</head>
<body>
    <h2>Popup / window.opener test</h2>
    <p>Click the button (or load with <code>?auto=1</code>). The popup checks <code>window.opener</code> and messages this page back.</p>
    <button id="open">Open popup</button>
    <p id="result">Waiting…</p>
    <script>
        function post(obj) {
            try { window.chrome.webview.postMessage(JSON.stringify(obj)); } catch (e) { }
        }

        function openPopup() {
            const w = window.open('popup.html', 'spikepopup', 'width=520,height=420');
            post({ kind: 'note', text: 'window.open returned ' + (w ? 'a window' : 'null') });
        }

        window.addEventListener('message', ev => {
            document.getElementById('result').textContent = 'Opener received: ' + ev.data;
            post({ kind: 'opener-received', data: String(ev.data).slice(0, 100) });
        });

        document.getElementById('open').addEventListener('click', openPopup);
        if (new URLSearchParams(location.search).get('auto') === '1') {
            openPopup();
        }
    </script>
</body>
</html>
