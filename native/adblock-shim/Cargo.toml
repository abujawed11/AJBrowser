# AJBrowser's thin C wrapper around Brave's adblock-rust engine (MPL-2.0).
# Build with build.ps1 (it copies the DLL to AJBrowser.Core/Native/). See README.md.
[package]
name = "adblock-shim"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
name = "adblock_shim"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features minus "single-thread": the engine must be Send + Sync, because AJBrowser builds it on a
# background thread and checks requests on the UI thread.
adblock = { version = "=0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Panics are caught at the C boundary (catch_unwind), so unwinding must stay on.
panic = "unwind"
